<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACN Socket.IO Tester</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #4f46e5;
    --accent-dim: rgba(79,70,229,0.15);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --yellow: #eab308;
    --yellow-dim: rgba(234,179,8,0.12);
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #fff;
  }

  header h1 span { color: var(--accent); }

  #status-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.3);
    transition: all 0.3s;
  }

  #status-badge.connected {
    background: var(--green-dim);
    color: var(--green);
    border-color: rgba(34,197,94,0.3);
  }

  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    display: grid;
    grid-template-columns: 320px 1fr 280px;
    height: calc(100vh - 61px);
    overflow: hidden;
  }

  /* ── Panels ── */
  .panel {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel:last-child { border-right: none; }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── Form Elements ── */
  label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea { resize: vertical; min-height: 70px; }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #4338ca; }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(239,68,68,0.2);
  }
  .btn-danger:hover { background: rgba(239,68,68,0.25); }

  .btn-success {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(34,197,94,0.2);
  }
  .btn-success:hover { background: rgba(34,197,94,0.25); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  /* ── Message Log ── */
  #log {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-entry {
    padding: 8px 12px;
    border-radius: var(--radius);
    border-left: 3px solid transparent;
    font-size: 12px;
    line-height: 1.5;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .log-entry.info { background: var(--accent-dim); border-color: var(--accent); color: #a5b4fc; }
  .log-entry.success { background: var(--green-dim); border-color: var(--green); color: #86efac; }
  .log-entry.error { background: var(--red-dim); border-color: var(--red); color: #fca5a5; }
  .log-entry.warning { background: var(--yellow-dim); border-color: var(--yellow); color: #fde047; }
  .log-entry.receive { background: #1e1e2e; border-color: #7c3aed; color: #c4b5fd; }

  .log-time { color: var(--muted); font-size: 10px; margin-right: 8px; }

  /* ── Online Users ── */
  #online-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--green-dim);
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: var(--radius);
    color: var(--green);
    font-size: 11px;
    animation: slideIn 0.2s ease;
  }

  .user-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  .empty-state {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 20px 0;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div style="width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;color:#fff;font-size:14px;">A</div>
  <h1>ACN <span>Socket</span> Tester</h1>
  <div id="status-badge">
    <div id="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
</header>

<main>

  <!-- LEFT: Controls -->
  <div class="panel">
    <div class="panel-header">Controls</div>
    <div class="panel-body">

      <!-- Connect -->
      <label>Server URL</label>
      <input id="serverUrl" value="http://localhost:5000" />

      <label>JWT Access Token</label>
      <textarea id="jwtToken" placeholder="Paste your JWT token here..."></textarea>

      <button class="btn-primary" onclick="connectSocket()">⚡ Connect</button>
      <button class="btn-danger" onclick="disconnectSocket()">✕ Disconnect</button>

      <hr class="divider">

      <!-- Join Chat -->
      <label>Chat ID</label>
      <input id="chatId" placeholder="MongoDB ObjectId of chat..." />
      <button class="btn-outline" onclick="joinChat()">📌 Join Chat Room</button>
      <button class="btn-outline" onclick="leaveChat()">📤 Leave Chat Room</button>

      <hr class="divider">

      <!-- Send Message -->
      <label>Message</label>
      <textarea id="messageInput" placeholder="Type a message..."></textarea>
      <button class="btn-success" onclick="sendMessage()">💬 Send Message</button>

      <hr class="divider">

      <!-- Typing -->
      <button class="btn-outline" onclick="startTyping()">✍️ Start Typing</button>
      <button class="btn-outline" onclick="stopTyping()">⬜ Stop Typing</button>

      <hr class="divider">

      <!-- Read Receipt -->
      <label>Message ID (for read receipt)</label>
      <input id="messageId" placeholder="MongoDB ObjectId of message..." />
      <button class="btn-outline" onclick="markRead()">✅ Mark as Read</button>

      <hr class="divider">

      <button class="btn-outline" onclick="clearLog()">🗑 Clear Log</button>
    </div>
  </div>

  <!-- MIDDLE: Event Log -->
  <div class="panel">
    <div class="panel-header">
      Event Log
      <span id="event-count" style="color:var(--accent);font-size:11px;">0 events</span>
    </div>
    <div class="panel-body">
      <div id="log">
        <div class="empty-state">Connect to start seeing events...</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Online Users -->
  <div class="panel">
    <div class="panel-header">
      Online Users
      <span id="online-count" style="color:var(--green);font-size:11px;">0</span>
    </div>
    <div class="panel-body">
      <div id="online-list">
        <div class="empty-state">No users online</div>
      </div>
    </div>
  </div>

</main>

<script>
  let socket = null;
  let eventCount = 0;
  const onlineUsers = new Set();

  function log(msg, type = 'info') {
    const logEl = document.getElementById('log');
    const empty = logEl.querySelector('.empty-state');
    if (empty) empty.remove();

    eventCount++;
    document.getElementById('event-count').textContent = `${eventCount} events`;

    const now = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.innerHTML = `<span class="log-time">${now}</span>${msg}`;
    logEl.appendChild(entry);
    logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;
  }

  function updateOnlineList() {
    const el = document.getElementById('online-list');
    document.getElementById('online-count').textContent = onlineUsers.size;

    if (onlineUsers.size === 0) {
      el.innerHTML = '<div class="empty-state">No users online</div>';
      return;
    }

    el.innerHTML = '';
    onlineUsers.forEach(uid => {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = `<div class="user-dot"></div><span>${uid.slice(0, 8)}...${uid.slice(-4)}</span>`;
      el.appendChild(chip);
    });
  }

  function setStatus(connected) {
    const badge = document.getElementById('status-badge');
    const text = document.getElementById('status-text');
    badge.className = connected ? 'connected' : '';
    text.textContent = connected ? 'Connected' : 'Disconnected';
  }

  function connectSocket() {
    const url = document.getElementById('serverUrl').value.trim();
    const token = document.getElementById('jwtToken').value.trim();

    if (!token) { log('⚠️ Please paste your JWT token first', 'warning'); return; }
    if (socket?.connected) { log('⚠️ Already connected', 'warning'); return; }

    log(`Connecting to ${url}...`, 'info');

    socket = io(url, {
      auth: { token },
      withCredentials: true,
      transports: ["websocket"]
    });

    socket.on('connect', () => {
      setStatus(true);
      log(`✅ Connected — Socket ID: <b>${socket.id}</b>`, 'success');
    });

    socket.on('disconnect', (reason) => {
      setStatus(false);
      onlineUsers.clear();
      updateOnlineList();
      log(`🔴 Disconnected — ${reason}`, 'error');
    });

    socket.on('connect_error', (err) => {
      log(`❌ Connection error: ${err.message}`, 'error');
    });

    socket.on('users:online', (users) => {
      users.forEach(u => onlineUsers.add(u));
      updateOnlineList();
      log(`👥 Online users received: ${users.length} user(s)`, 'info');
    });

    socket.on('user:online', ({ userId }) => {
      onlineUsers.add(userId);
      updateOnlineList();
      log(`🟢 User came online: ${userId}`, 'success');
    });

    socket.on('user:offline', ({ userId }) => {
      onlineUsers.delete(userId);
      updateOnlineList();
      log(`🔴 User went offline: ${userId}`, 'warning');
    });

    socket.on('message:receive', (msg) => {
      log(`💬 Message received in chat <b>${msg.chatId}</b><br>
           &nbsp;&nbsp;From: ${msg.sender?.name || msg.sender}<br>
           &nbsp;&nbsp;Encrypted: ${msg.encryptedContent?.slice(0, 40)}...`, 'receive');
    });

    socket.on('typing:start', ({ name, chatId }) => {
      log(`✍️ ${name} is typing in chat ${chatId}`, 'info');
    });

    socket.on('typing:stop', ({ userId, chatId }) => {
      log(`⬜ User ${userId} stopped typing in chat ${chatId}`, 'info');
    });

    socket.on('message:read', ({ messageId, readBy }) => {
      log(`✅ Message <b>${messageId}</b> read by ${readBy}`, 'success');
    });

    socket.on('error', ({ message }) => {
      log(`❌ Server error: ${message}`, 'error');
    });
  }

  function disconnectSocket() {
    if (!socket) { log('⚠️ Not connected', 'warning'); return; }
    socket.disconnect();
  }

  function joinChat() {
    const chatId = document.getElementById('chatId').value.trim();
    if (!chatId) { log('⚠️ Enter a Chat ID first', 'warning'); return; }
    if (!socket?.connected) { log('⚠️ Connect first', 'warning'); return; }
    socket.emit('chat:join', chatId);
    log(`📌 Joining chat room: <b>${chatId}</b>`, 'info');
  }

  function leaveChat() {
    const chatId = document.getElementById('chatId').value.trim();
    if (!chatId) { log('⚠️ Enter a Chat ID first', 'warning'); return; }
    if (!socket?.connected) { log('⚠️ Connect first', 'warning'); return; }
    socket.emit('chat:leave', chatId);
    log(`📤 Left chat room: <b>${chatId}</b>`, 'warning');
  }

  function sendMessage() {
    const chatId = document.getElementById('chatId').value.trim();
    const content = document.getElementById('messageInput').value.trim();
    if (!chatId || !content) { log('⚠️ Enter Chat ID and message', 'warning'); return; }
    if (!socket?.connected) { log('⚠️ Connect first', 'warning'); return; }

    // Simulate E2EE — in production this will be real AES encryption
    const fakeEncrypted = btoa(content);
    const fakeIv = btoa(Math.random().toString(36).slice(2));

    socket.emit('message:send', {
      chatId,
      encryptedContent: fakeEncrypted,
      iv: fakeIv,
    });

    log(`📤 Message sent to chat <b>${chatId}</b><br>&nbsp;&nbsp;Simulated encrypted: ${fakeEncrypted.slice(0, 40)}...`, 'info');
    document.getElementById('messageInput').value = '';
  }

  function startTyping() {
    const chatId = document.getElementById('chatId').value.trim();
    if (!chatId || !socket?.connected) { log('⚠️ Connect and enter Chat ID', 'warning'); return; }
    socket.emit('typing:start', { chatId });
    log(`✍️ Sent typing:start to chat ${chatId}`, 'info');
  }

  function stopTyping() {
    const chatId = document.getElementById('chatId').value.trim();
    if (!chatId || !socket?.connected) { log('⚠️ Connect and enter Chat ID', 'warning'); return; }
    socket.emit('typing:stop', { chatId });
    log(`⬜ Sent typing:stop to chat ${chatId}`, 'info');
  }

  function markRead() {
    const chatId = document.getElementById('chatId').value.trim();
    const messageId = document.getElementById('messageId').value.trim();
    if (!chatId || !messageId || !socket?.connected) { log('⚠️ Connect, enter Chat ID and Message ID', 'warning'); return; }
    socket.emit('message:read', { chatId, messageId });
    log(`✅ Sent read receipt for message ${messageId}`, 'info');
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '<div class="empty-state">Log cleared...</div>';
    eventCount = 0;
    document.getElementById('event-count').textContent = '0 events';
  }
</script>
</body>
</html>
